<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#filmGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Cloud Base -->
  <g filter="url(#glow)">
    <path d="M168 340 h176 a64 64 0 0 0 16-126 a88 88 0 0 0 -168 -32 a56 56 0 0 0 -24 158 z" fill="url(#cloudGrad)" opacity="0.95"/>
  </g>

  <!-- Play Triangle in Cinema Style -->
  <path d="M232 208 L312 256 L232 304 Z" fill="url(#filmGrad)"/>

  <!-- Film Roll Sprocket Holes Header -->
  <g fill="#ec4899" opacity="0.8">
    <rect x="136" y="80" width="32" height="24" rx="4"/>
    <rect x="184" y="80" width="32" height="24" rx="4"/>
    <rect x="232" y="80" width="32" height="24" rx="4"/>
    <rect x="280" y="80" width="32" height="24" rx="4"/>
    <rect x="328" y="80" width="32" height="24" rx="4"/>
  </g>
</svg>
