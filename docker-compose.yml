services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mycloud-cinema-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE_DIR=/data/storage
    volumes:
      - cinema_storage:/data/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/system/status"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mycloud-cinema-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: mycloud-cinema-grafana
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  cinema_storage:
    driver: local
  prometheus_data:
  grafana_data:
